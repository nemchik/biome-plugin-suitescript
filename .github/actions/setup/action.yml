name: setup
description: Install the Node.js and npm versions from package.json devEngines, then the dependencies

inputs:
  cache:
    description: Restore and save the npm cache. Set to "false" in workflows that publish or hold secrets.
    default: "true"

  suitecloud-sdk:
    description: >-
      Accept Oracle's FUTC license (ADR 0008) so the SuiteCloud CLI postinstall
      downloads its jar. Set to "true" only in jobs without publishing rights
      or secrets. When "false", install scripts are skipped (`--ignore-scripts`):
      on a headless runner the postinstall exits 3 without the license.
    default: "false"

runs:
  using: composite
  steps:
    - name: Use Node.js from package.json devEngines
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        registry-url: https://registry.npmjs.org
        package-manager-cache: ${{ inputs.cache }}
    - name: Use npm from package.json devEngines
      shell: bash
      run: npm install --global "npm@$(node -p "require('./package.json').devEngines.packageManager.version")"
    - name: Install npm dependencies
      shell: bash
      env:
        SUITECLOUD_SDK: ${{ inputs.suitecloud-sdk }}
      run: |
        if [ "$SUITECLOUD_SDK" = "true" ]; then
          SUITECLOUD_CLI_ACCEPT_LICENSE=true npm ci
        else
          npm ci --ignore-scripts
        fi
