name: Update agent skills
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - run: npm run skills:update
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/update-skills
          commit-message: "chore: update agent skills"
          title: "chore: update agent skills"
          body: |
            Generated by `npm run skills:update` from the sources recorded in `skills-lock.json`.

            If anything under `.agents/skills/netsuite-*` changed, review the rules that cite those skills against `docs/rule-priority.md` before merging.
