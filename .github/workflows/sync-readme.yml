name: Sync README rules table and rule pages
on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      # The table and the pages read biome-manifest.json and configs/*.json, which the build writes.
      - run: npm run build
      - run: npm run readme
      - run: npm run docs
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/sync-readme
          commit-message: "docs: regenerate the README rules table and rule pages"
          title: "docs: regenerate the README rules table and rule pages"
          body: Generated by `npm run readme` and `npm run docs` from `scripts/rule-sources.ts`, the manifest, the preset configs and `test/cases.ts`.
