name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `locked` is the pinned version from package-lock.json (the minimum
        # supported); `latest` catches breakage in the JS plugin preview early.
        biome: [locked, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          suitecloud-sdk: "true"
      - name: Use latest Biome
        if: matrix.biome == 'latest'
        env:
          SUITECLOUD_CLI_ACCEPT_LICENSE: "true"
        run: npm install --no-save @biomejs/biome@latest @biomejs/runtime@latest
      - run: npm run build && git diff --exit-code
        if: matrix.biome == 'locked'
      - run: npm run sync-modules -- --check
        if: matrix.biome == 'locked'
      - run: npm run sync-typings -- --check
        if: matrix.biome == 'locked'
      - run: npm test
