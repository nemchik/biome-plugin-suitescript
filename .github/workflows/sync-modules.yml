name: Sync NetSuite modules
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      # Pull in the newest type declarations so new N/ modules are picked up.
      - run: npm install --no-save @hitc/netsuite-types@latest
      - run: npm run sync-modules
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/sync-modules
          commit-message: "feat: add new NetSuite modules"
          title: "feat: add new NetSuite modules"
          body: Generated by `npm run sync-modules` from the latest `@hitc/netsuite-types`.
