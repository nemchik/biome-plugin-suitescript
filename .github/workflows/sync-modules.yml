name: Sync NetSuite modules and typings data
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      # Pull in the newest type declarations so new N/ modules, options and enums are picked up.
      - run: npm install --no-save @hitc/netsuite-types@latest
      - run: npm run sync-modules
      - run: npm run sync-typings
      - uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: chore/sync-modules
          commit-message: "feat: update NetSuite modules and typings data"
          title: "feat: update NetSuite modules and typings data"
          body: Generated by `npm run sync-modules` and `npm run sync-typings` from the latest `@hitc/netsuite-types`. If `npm test` fails on the typings gaps test, a gap in `scripts/typings-gaps.ts` is fixed upstream and can be removed.
